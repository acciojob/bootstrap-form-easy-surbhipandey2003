<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" 
		rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" 
		crossorigin="anonymous">
</head>
<body>
	<div class="container mt-4">
	<h1 class="text-center mb-4">Internship Form</h1>
		
	<div class="row mb-3">
		<div class="col-sm-4">
	       <label for="first-name-input" class="form-label">First Name</label>
	       <input type="text" id="first-name-input" class="form-control">
		</div>
		<div class="col-sm-4">
	       <label for="last-name-input" class="form-label">Last Name</label>
	       <input type="text" id="last-name-input" class="form-control">
		</div>	
	   <div class="col-sm-4">
	      <label for="email-input" class="form-label">Email Address</label>
	      <input type="email" id="email-input" class="form-control" placeholder="xyz@abc.com">
	   </div>	   
	</div>
	<div class="row mb-3">
	    <div class="col-sm-4">
		   <label for="college-input" class="form-label">College</label>
		   <input type="text" id="college-input" class="form-select">
	    </div>
		<div class="col-sm-4">
		   <label for="graduation-year-input" class="form-label">Graduation Year</label>
	       <select id="graduation-year-input" class="form-select">
			   <option>Choose...</option>
			   <option>2020</option>
			   <option>2021</option>
			   <option>2022</option>
			   <option>2023</option>
		   </select>
		</div>	
		<div class="col-sm-4">
		   <label for="roll-no-input" class="form-label">Roll No.</label>
		   <input type="text" id="roll-no-input" class="form-control">
	    </div>
	</div>	
	
	<div class="form-check mb-3">
		<input type="checkbox" id="condition-checkbox" class="form-check-input">
		<label for="condition-checkbox" class="form-check-label">Agree to terms and conditions</label>
	</div>

	<button type="submit" class="btn btn-primary">Submit form</button>	
  </div>
  <script type="text/javascript" src="./script.js"></script>

</body>

</html>
